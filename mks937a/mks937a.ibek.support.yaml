# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: mks937a 2-97
# Source: /dls_sw/prod/R3.14.12.7/support/mks937a/2-97
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/mks937a/ release.
#
# Templates needing a generic IOC built with this module (not the plain
# generic image):
# - `mks937aGauge.template` needs a generic IOC built with `mks937a` (compiled support), not the plain generic image.
# - `mks937aImgMean.template` needs a generic IOC built with `mks937a` (compiled support), not the plain generic image.
#
# `simulation_mks937aImg.template` and `simulation_mks937aPirg.template` are NOT
# imported into sim/: they call sub $(device):SIM:P SNAM=pressRanProcess and
# INAM=pressRanInit, neither of which is registered in the generic image - loading
# them is fine, but iocInit fails. `simulation_mks937a.template` and
# `simulation_mks937aGauge.template` have no such routine and are imported into sim/.

module: mks937a

entity_models:
  - name: mks937a
    description: |-
      Template database for an MKS937A Multi-Sensor System (vacuum gauge
      controller) read over StreamDevice.
    parameters:
      device:
        type: str
        description: |-
          Device name
      port:
        type: str
        description: |-
          Asyn Port name, e.g. ty_40_0
    databases:
      - file: mks937a.template
        args:
          .*:

  - name: mks937aGauge
    description: |-
      Imported from DLS module mks937a (mks937aGauge.template)
