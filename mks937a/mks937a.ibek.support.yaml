      id:
        type: str
        description: |-
          id
      aitype:
        type: str
        description: |-
          aitype
        default: "Hy8401ip"
      aiinp:
        type: str
        description: |-
          aiinp: INP of the PLOG ai record, e.g. "0" or another record, with
          aitype "Soft Channel". Required: the template's own default
