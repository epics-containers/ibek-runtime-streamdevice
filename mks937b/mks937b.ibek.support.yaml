# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: mks937b 2-98
# Source: /dls_sw/prod/R3.14.12.7/support/mks937b/2-98
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release,
# except mks937bImgMean.template (below).
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/mks937b/ release.
#
# Derived: mks937bImgMean.template. Its aSub $(device):MEAN called the compiled
# routine mks937bMeanCalc (mks937bApp/src/mks937bMean.c), the module's only compiled
# code. It is replaced by base calc/calcout records that compute the same values,
# bit for bit, and write them every scan as the aSub did; MEAN stays as a fanout with
# the same scan. The template's header and the replaced record's comment say how.
# No template needs the compiled mks937b library.
#
# Templates needing more than the plain generic image:
# - `mks937bHy8401.template` needs an image with Hytec Hy8401ip device support
#   (DTYP "Hy8401ip", e.g. an RTEMS/VME IOC), not mks937b.
#
# ibek-support builds the compiled module from release 3-1-0 instead (GitHub). Its
# templates match these but for the stripped `# % gui` annotations, and
# mks937bRelays.template, which here gives :SETMODE PRIO HIGH and :MODE PRIO
# MEDIUM, so a relay mode write jumps the controller's poll queue.
#
# Entity models: those of ibek-support's mks937b (epics-containers/ibek-support
# e91a17c, mks937b/mks937b.ibek.support.yaml), which mirror the DLS builder.py: the same
# entity names, parameters, object references and Jinja, so an IOC converted by
# builder2ibek for the compiled module loads this pattern unchanged. Their
# databases point at this pattern's own templates, and their pvi: blocks are
# generate-pvi.py's.
#
# Added to those models: auto_mks937bHcg, auto_mks937bHcgGroup and
# auto_mks937bInterlock, the builder's AutoSubstitution of templates that
# builder.py has no class for (the XML names them mks937b.auto_<template>), with
# the template's macros as parameters. auto_mks937bHcg also takes `name`, as the
# GAUGE of mks937bRelays and mks937bFastRelay, which therefore read port and
# address from the GAUGE itself when it has no GCTLR. auto_mks937bInterlock has
# the parameters of ibek-support's auto_mks937aInterlock, plus `name` (default
# ""), the template's $(name).

module: mks937b

entity_models:
  - name: mks937bRelays
    description: |-
      TODO:ADD DESCRIPTION
    parameters:
      GAUGE:
        type: object
        description: |-
          TODO: ADD DESCRIPTION

      relay_number:
        type: int
        description: |-
          The relay number (1..12).

      relay_desc:
        type: str
        description: |-
          The DESC field on the relay setpoint record
        default: Valve Interlock

      relay_off_desc:
        type: str
        description: |-
          (appears as a label on the Img EDM screen).
        default: Relay OFF setpoint

      relay_level:
        type: float
        description: |-
          vv================vv  New feature request May 2012.
        default: 1e-06

      relay_off_level:
        type: float
        description: |-
          The desired relay off setpoint value.
        default: 0.0

      relay_drvh:
        type: float
        description: |-
          (limits max value of relay setpoint)
        default: 0.012

      relay_drvl:
        type: float
        description: |-
          (limits min value of relay setpoint)
        default: 2.7e-10

      relay_hopr:
        type: float
        description: |-
          (high operator value - helps display set correct range).
        default: 0.012

      relay_lopr:
        type: float
        description: |-
          (low operator value - helps display set correct range).
        default: 2.7e-10

      relay_hihi:
        type: float
        description: |-
          The HIHI alarm field on the relay setpoint record.
        default: 0.013

      relay_lolo:
        type: float
        description: |-
          The LOLO alarm field on the relay setpoint record.
        default: 2.6e-10

      relay_high:
        type: float
        description: |-
          The HIGH alarm field on the relay setpoint record.
        default: 1.1e-06

      relay_low:
        type: float
        description: |-
          The LOW alarm field on the relay setpoint record.
        default: 9e-07

      ilk_write_access_pv:
        type: str
        description: |-
          Link to the interlocks setpoint global write access record.
        default: $(device):CONSTZERO

    post_defines:
      relay_n:
        description: get the next relay number from the associated gauge
        type: int
        value: |-
          {% set nothing = GAUGE.relay_count.append(0) %}
          {{ GAUGE.relay_count | length }}

    databases:
      - file: mks937bRelays.template
        args:
          address: "{{ '%03d' % GAUGE.GCTLR.address if GAUGE.GCTLR is defined else GAUGE.address }}"
          port: "{{ GAUGE.GCTLR.port if GAUGE.GCTLR is defined else GAUGE.port }}"
          device: "{{ GAUGE.device ~ ':RLY' ~ relay_n }}"
          relay_drvh:
          relay_drvl:
          relay_off_desc:
          relay_hopr:
          relay_desc:
          relay_lolo:
          ilk_write_access_pv:
          relay_low:
          GAUGE:
          relay_number:
          relay_hihi:
          relay_high:
          relay_level:
          relay_off_level:
          relay_lopr:
    pvi:
      yaml_path: mks937bRelays.pvi.device.yaml
      ui_macros:
        device: "{{ GAUGE.device ~ ':RLY' ~ relay_n }}"

