# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: mks937b 2-98
# Source: /dls_sw/prod/R3.14.12.7/support/mks937b/2-98
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/mks937b/ release.
#
# Templates needing a generic IOC built with this module (not the plain
# generic image):
# - `mks937bHy8401.template` needs a generic IOC built with `mks937b` (compiled support), not the plain generic image.
# - `mks937bImgMean.template` needs a generic IOC built with `mks937b` (compiled support), not the plain generic image.

