# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: ODPsu 3-2
# Source: /dls_sw/prod/R3.14.12.7/support/ODPsu/3-2
# The templates are VisualDCT sources -- derived, not pristine byte-copies: VDCT
# header/footer junk ("#!" lines) has been stripped, and so have the DLS EDM/GDA
# annotation comments (see strip-dls-annotations.py).
# This release's etc/builder.py declares 25 entity classes; only 8 were
# originally vendored here. The 14 ODPsugda* classes and the 3 ODPsu*DUpdate
# classes were added from the same release (ODPsu22DUpdate is used by real IOCs,
# e.g. BL02I-MO-IOC-01 / BL03I-MO-IOC-01; the ODPsugda* numbered variants are
# produced at DLS build time by sed-substituting NCHAN into ODPsugda(V2).template
# -- there is no separate VDCT source for them, so they were taken from the
# release's built db/ output instead of ODPsuApp/Db).
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/ODPsu/ release.

module: ODPsu

entity_models:
  - name: ODPsu
    description: |-
      ODPsu power supply control
    parameters:
      P:
        type: str
        description: |-
          device name prefix (name will be $(P)$(Q))
      Q:
        type: str
        description: |-
          device name qualifier (name will be $(P)$(Q))
      PORT:
        type: str
        description: |-
          Asyn port name
    databases:
      - file: ODPsu.template
        args:
          .*:

