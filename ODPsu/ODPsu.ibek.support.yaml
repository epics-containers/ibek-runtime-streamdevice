        description: |-
          power supply bank number (0 - 1)
      BSTART:
        type: int
        description: |-
          starting channel number of the bank (offset used by the channel-count records)
      NCHAN:
        type: int
        description: |-
          number of channels in the PSU (1-24)
      PV:
        type: str
        description: |-
          PV prefix of the VOUT/TARGET records reprocessed when the channel count changes
      DLY:
        type: float
        description: |-
          delay (s) applied to the calcout record's second output (DLY2)
    databases:
