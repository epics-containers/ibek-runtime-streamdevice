# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: PIpiezo 1-23
# Source: /dls_sw/prod/R3.14.12.7/support/PIpiezo/1-23
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/PIpiezo/ release.
#
# Templates needing a generic IOC built with this module (not the plain
# generic image):
# - `E871-absGrp.template` needs a generic IOC built with `PIpiezo` (compiled support), not the plain generic image.
# - `PI-E516.template` needs a generic IOC built with `PIpiezo` (compiled support), not the plain generic image.

module: PIpiezo

entity_models:
  - name: E725
    description: |-
      Controls a PI E725 piezo controller
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      Q:
        type: str
        description: |-
          Device suffix
      C:
        type: str
        description: |-
          Axis Name (use X or Y for standard 2 axis GUI)
      AXIS:
        type: str
        description: |-
          Axis Description
      EGU:
        type: str
        description: |-
          Engineering units
        default: "mm"
      TWSIZE:
        type: float
        description: |-
          Default tweak size
        default: 1
      PREC:
        type: int
        description: |-
          Precision
        default: 3
      DEADBAND:
        type: float
        description: |-
          Default Deadband
        default: 0.1
      PORT:
        type: str
        description: |-
          Asyn port for I/O with controller
    databases:
      - file: E725.template
        args:
          .*:

  - name: E871
    description: |-
      Controls a PI E871 piezo controller
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      Q:
        type: str
        description: |-
          Device suffix
      C:
        type: str
        description: |-
          Axis Name
      AXIS:
        type: int
        description: |-
          Axis number for daisy chained stages (1-16), default is 1
        default: 1
      PORT:
        type: str
        description: |-
          Asyn port for I/O with controller
      EGU:
        type: str
        description: |-
          engineering units for value of move commands to controller, defaults to mm
        default: "mm"
      MODE:
        type: int
        description: |-
          Mode to select between 'Demand'(1) position and 'Readback'(0) position values in the tweak demand calculation, default is 1
        default: 1
    databases:
      - file: E871.template
        args:
          .*:

