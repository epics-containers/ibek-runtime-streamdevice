# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: knauer 0-6
# Source: /dls_sw/prod/R3.14.12.7/support/knauer/0-6
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/knauer/ release.

module: knauer

entity_models:
  - name: BlueShadow40P
    description: |-
      Controls a Knauer BlueShadow 40P HPLC pump
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      R:
        type: str
        description: |-
          Device suffix
      PORT:
        type: str
        description: |-
          Asyn Port for communication with device
    databases:
      - file: blueShadow40P.template
        args:
          .*:
    pvi:
      yaml_path: BlueShadow40P.pvi.device.yaml
      ui_macros:
        P:
        R:
  - name: Azura21S
    description: |-
      Controls a Knauer Azuar V2.1S valve drive
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      R:
        type: str
        description: |-
          Device suffix
      PORT:
        type: str
        description: |-
          Asyn Port for communication with device
    databases:
      - file: azuraV2-1S.template
        args:
          .*:
    pvi:
      yaml_path: Azura21S.pvi.device.yaml
      ui_macros:
        P:
        R:

  - name: ConnectionManagement
    description: |-
      Monitors a connection to a Knauer device
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      R:
        type: str
        description: |-
          Device suffix
    databases:
      - file: connectionManagement.template
        args:
          .*:
    pvi:
      yaml_path: ConnectionManagement.pvi.device.yaml
      ui_macros:
        P:
        R:

  - name: PumpAndValve
    description: |-
      The EDM screen of a BlueShadow 40P pump and an Azura V 2.1 S valve drive
      used together. It creates no records: the release's pumpAndValve.template
      holds only `# % gui` annotations, which have no consumer in
      epics-containers. Accepted so that this entity of a converted builder IOC
      validates.
    parameters:
      PUMP:
        type: str
        description: |-
          Pump prefix and suffix
      VALVE:
        type: str
        description: |-
          Valve prefix and suffix
