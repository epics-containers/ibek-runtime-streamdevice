# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: VatLeakValve590 1-5
# Source: /dls_sw/prod/R3.14.12.7/support/VatLeakValve590/1-5
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release,
# except for these scripted changes:
# - VATLeakValve590series.template: DTYP "soft channel" -> "Soft Channel" (12 records);
#   DTYP "stream" dropped from the 2 calc records (calc has no device support);
#   SCAN "1 seccond" -> "1 second" and "0.5 second" -> ".5 second"; PINI "yes" -> "YES";
#   ZRSV/ONSV -> ZSV/OSV on 6 bi records (ZRSV/ONSV are mbbi fields).
#   EPICS 7 rejects each of these, so the file does not load without them.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/VatLeakValve590/ release.

module: VatLeakValve590

entity_models:
  - name: _VatLeakValve590seriesTemplate
    description: |-
      Template database for VAT Variable Leak Valve 590 Series
    parameters:
      device:
        type: str
        description: |-
          device name
      port:
        type: str
        description: |-
          asyn serial port number (e.g. ty_40_0)
      proto:
        type: str
        description: |-
          name of protocol file, either V590.proto
        default: V590.proto
    databases:
      - file: VATLeakValve590series.template
        args:
          .*:

  - name: VatLeakValve590series
    description: |-
      VAT Variable Leak Valve 590 Series
    parameters:
      device:
        type: str
        description: |-
          Device name
      port:
        type: str
        description: |-
          Asyn Port
      proto:
        type: str
        description: |-
          Protocol file to use (V590.proto)
        default: V590.proto
    databases:
      - file: VATLeakValve590series.template
        args:
          .*:
