# read an array of 10 words of IO memory (into a string)
readIO10	{ out $header,"RR\$10010",$term;
		  in  $header,"RR00%39s%*1s",$term }

# Todo: implement as waveform
# read an array of 10 words of data memory (into a string)
readAR10	{ out $header,"RJ\$10010",$term;
		  in  $header,"RJ00%39s%*1s",$term }

# FINS message
FINS		{ out $header,"FA000000000\$100",$term;
		  in  $header,"FA00%*20s%38s%*2s",$term }

# Abort a command - no response
abort		{ out $header,"XZ",$term; }

