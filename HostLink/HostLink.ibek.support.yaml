# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: HostLink 3-3
# Source: /dls_sw/prod/R3.14.12.7/support/HostLink/3-3
# Pristine copies of the StreamDevice protocols + EPICS db/template from that release:
#   - HostlinkFINS.proto: data/HostlinkFINS.proto, used by HostLink.template;
#   - Hostlink.proto: data/Hostlink.proto, the C-mode (RD/WD) protocol. No model
#     here uses it: it is for templates of other patterns, such as
#     BL05I_waterChiller.template of ibek-runtime-support's BL05I pattern, which
#     DLS builds against HostLink 3-3. An IOC instance that vendors this pattern
#     gets it in config/, and the IOC places it on STREAM_PROTOCOL_PATH;
#   - HostLink.template: db/HostLink.template.
# The HostLink model loads nothing: the IOC finds both protocols once this
# pattern is vendored, with or without an entity of it.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/HostLink/ release.

module: HostLink

entity_models:
  - name: HostLink
    description: |-
      HostLink FINS protocol module (loads the stream protocol file)
  - name: HostLinkTemplate
    description: |-
      Omron PLC HostLink FINS communications status and clock readbacks
    parameters:
      device:
        type: str
        description: |-
          Device name / PV prefix
      port:
        type: str
        description: |-
          asyn port name
    databases:
      - file: HostLink.template
        args:
          .*:
    pvi:
      yaml_path: HostLinkTemplate.pvi.device.yaml
      ui_macros:
        device:
