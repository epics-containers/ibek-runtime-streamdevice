# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: OXCS700 2-22
# Source: /dls_sw/prod/R3.14.12.7/support/OXCS700/2-22
#
# OXCS700.proto is a pristine copy of that release's OXCS700App/protocol.
#
# The .template files are DERIVED, not pristine: they come from that release's
# OXCS700App/Db VDCT sources, converted to msi-native include/substitute by
# vdct2template (VDCT does not exist in the EPICS 7 base epics-containers uses).
#
# OXcommon700.template is an msi `include` target pulled in by both entity
# templates, not an entity of its own. Its macros carry a _ prefix because msi
# will not apply a default when substituting a macro with its own name.
#
# Verified: both entity templates expand under msi to the same record and field
# set as that release's VDCT-built db/ copies.
#
# NOTE: the two __doc__ annotations are swapped in 2-22 upstream (OXCS700.vdb
# is labelled "(Phenix)"). The descriptions below follow the device names.
#
# To check for updates: diff OXCS700.proto against that path, and re-run the
# conversion on the newest /dls_sw/prod/*/support/OXCS700/ release.

module: OXCS700

entity_models:
  - name: OXPH700
    description: |-
      Control for Oxford cryostream 700 series (Phenix)
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      Q:
        type: str
        description: |-
          Device suffix
      PORT:
        type: str
        description: |-
          Asyn port to connect to
      name:
        type: id
        description: |-
          Object and gui association name
      DISABLE_COMMS:
        type: int
        description: |-
          Optional macro to control whether comms are disabled (1) or not (0) on startup. Defaults to disabled
        default: 1
    databases:
      - file: OXPH700.template
        args:
          .*:
  - name: OXCS700
    description: |-
      Control for Oxford cryostream 700 series
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      Q:
        type: str
        description: |-
          Device suffix
      PORT:
        type: str
        description: |-
          Asyn port to connect to
      name:
        type: id
        description: |-
          Object and gui association name
      DISABLE_COMMS:
        type: int
        description: |-
          Optional macro to control whether comms are disabled (1) or not (0) on startup. Defaults to disabled
        default: 1
    databases:
      - file: OXCS700.template
        args:
          .*:
