# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: harvardSyringe 1-12
# Source: /dls_sw/prod/R3.14.12.7/support/harvardSyringe/1-12
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release,
# except for these scripted changes:
# - harvardSyringe.template: 2 DESC strings shortened to 40 characters or fewer
#   (EPICS 7 rejects longer DESC values).
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/harvardSyringe/ release.

module: harvardSyringe

entity_models:
  - name: harvardSyringe
    description: |-
      Harvard Syringe Pump
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      Q:
        type: str
        description: |-
          Device suffix
      PORT:
        type: str
        description: |-
          Asyn port name
      DISABLE:
        type: int
        description: |-
          Set to 0 to enable this at startup
        default: 1
    databases:
      - file: harvardSyringe.template
        args:
          .*:
