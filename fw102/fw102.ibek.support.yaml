# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: fw102 2-1
# Source: /dls_sw/prod/R3.14.12.7/support/fw102/2-1
# fw102.template is a pristine copy of that release's db/fw102.template.
# fw102.proto deviates from the pristine data/fw102.proto in one line: setPos reads
# the device's echo of the command (`in "pos=%*d";`), which the DLS protocol leaves
# unread in the input buffer.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/fw102/ release.

module: fw102

entity_models:
  - name: _fw102Template
    description: |-
      Thorlabs FW102 motorised filter wheel
    parameters:
      P:
        type: str
        description: |-
          PV name prefix
      R:
        type: str
        description: |-
          PV name suffix
      PORT:
        type: str
        description: |-
          asyn port name
      FILTER1:
        type: str
        description: |-
          Material in filter slot 1
      FILTER2:
        type: str
        description: |-
          Material in filter slot 2
      FILTER3:
        type: str
        description: |-
          Material in filter slot 3
      FILTER4:
        type: str
        description: |-
          Material in filter slot 4
      FILTER5:
        type: str
        description: |-
          Material in filter slot 5
      FILTER6:
        type: str
        description: |-
          Material in filter slot 6
    databases:
      - file: fw102.template
        args:
          .*:
