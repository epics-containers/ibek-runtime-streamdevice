# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: motomanNX100 1-17-1
# Source: /dls_sw/prod/R3.14.12.7/support/motomanNX100/1-17-1
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# auto_nx100io is the name XMLbuilder gives the AutoSubstitution of
# nx100io.template; it loads the same template as nx100io.
