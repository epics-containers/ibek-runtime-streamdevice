# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: eurotherm2k 2-10
# Source: /dls_sw/prod/R3.14.12.7/support/eurotherm2k/2-10
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# The eurotherm2k entity model is hand-written (ibek-runtime-streamdevice#22). Its
# parameter defaults are the template's own macro defaults (SPMAX=1000, SPMIN=0,
# EGU=C/s), which are also the defaults of the build-time ibek-support-dls model.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/eurotherm2k/ release.
#
# Only the StreamDevice eurotherm2k device is in this pattern. Left out:
# - eurothermModbus, eurothermModbusLoop and eurothermModbusPV: the DLS builder.py
#   classes create their Modbus asyn port at startup with compiled commands
#   (modbusInterposeConfig, eurothermModbusCtrlConfigure,
#   eurothermModbusLoopConfigure, drvModbusAsynConfigure), which no runtime image
#   has. They belong in a generic IOC built with Modbus support, modelled at build
#   time from ibek-support/eurothermModbus.
# - eurothermParam.template, eurothermConfParam.template, eurothermPV.template:
#   no builder.py class loads them, so no builder XML can use them.

module: eurotherm2k

entity_models:
  - name: eurotherm2k
    description: |-
      Eurotherm 2k temperature controller
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      Q:
        type: str
        description: |-
          Device suffix
        default: ""
      PORT:
        type: str
        description: |-
          Asyn port name
      GAD:
        type: int
        description: |-
          Global address number, normally 0
      LAD:
        type: int
        description: |-
          Local address number, normally 1
      SPMAX:
        type: float
        description: |-
          Maximum setpoint
        default: 1000
      SPMIN:
        type: float
        description: |-
          Minimum setpoint
        default: 0
      RRMAX:
        type: float
        description: |-
          Maximum ramp rate
        default: 1
      SPCMD:
        type: str
        description: |-
          Setpoint command, set to 'write' for floating point
        default: writeint
      PREC:
        type: int
        description: |-
          Setpoint precision
        default: 0
      EGU:
        type: str
        description: |-
          Engineering units for ramp rate, default is C/s
        default: C/s
      desc:
        type: str
        description: |-
          Description for CSS.
          Documentary: accepted for builder XML compatibility; not passed to the template.
        default: Eurotherm 2K
    databases:
      - file: eurotherm2k.template
        args:
          '(?!desc$).*':
    pvi:
      yaml_path: eurotherm2k.pvi.device.yaml
      ui_macros:
        P:
        Q:
