  - name: yaskawaReal
    description: |-
      Define yaskawa robot controller Real (float) variables that can be set and read in EPICS
    parameters:
      P:
        type: str
        description: |-
          PV prefix
      STREAMS_PORT:
        type: str
        description: |-
          Stream port
      VAR:
        type: str
        description: |-
          Real variable number to read/write.  Must be 3 digits - prefix with zeroes, e.g. 001.
      DISWRITE:
        type: str
        description: |-
          When the given PV is equal to DISV this variable cannot be written to. Default can't just be set to the prefix otherwise record will not be processed. STA2=64 is used as this prevents this variable being changed when the robot servo is on.
        default: "STA2"
      DISV:
        type: str
        description: |-
          Value that DISWRITE is compared to
        default: "64"
      SCAN:
        type: str
        description: |-
          Scan rate (0.2s is too fast)
      DRVL:
        type: str
        description: |-
          Low limit
      DRVH:
        type: str
        description: |-
          High limit
      DESC:
        type: str
        description: |-
          Variable's description
        default: ""
    databases:
      - file: yaskawaReal.template
        args:
          .*:

  - name: BARTRobot
    description: |-
      Yaskawa controller type and jobs run from EPICS, plus: Yaskawa variable numbers used by
      the sample exchange jobs for Carrier Column, Row and Slot (jobs can be prevented from
      running if these variables have not been received by the controller within 1 second),
      and a PLC port for reading the gripper and barcode reader.
      NOTE: needs a generic IOC built with yaskawaBARTRobot (not the plain generic image).
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      PORT:
        type: str
        description: |-
          Fins port
      STREAMS_PORT:
        type: str
        description: |-
          Stream port
      TYPE:
        type: str
        description: |-
          Type of Yaskawa robot controller: DX, FS, NX or YR
      CUR_COLUMN_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the current column. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      CUR_ROW_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the current row. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      CUR_SLOT_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the current slot within carrier. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      NEXT_COLUMN_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the next column. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      NEXT_ROW_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the next row. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      NEXT_SLOT_VAR_NUM:
        type: str
        description: |-
          The Yaskawa variable number to use for the next slot within carrier. Must be 3 digits - prefix with zeroes, e.g. 081. (Note that the Yaskawa variable type is called a double (D in epics) but this is actually a long int.)
      COORDSYS:
        type: str
        description: |-
          Coordinate system to use for displaying the robot position
        default: "1"
      DISWRITE:
        type: str
        description: |-
          When the given PV is equal to DISV, internal variables cannot be written to
        default: "STA2"
      DISV:
        type: str
        description: |-
          Value that DISWRITE is compared to
        default: "64"
      JOB1:
        type: str
        description: |-
          Job 1 name
        default: "NOP"
      JOB2:
        type: str
        description: |-
          Job 2 name
        default: ""
      JOB3:
        type: str
        description: |-
          Job 3 name
        default: ""
      JOB4:
        type: str
        description: |-
          Job 4 name
        default: ""
      JOB5:
