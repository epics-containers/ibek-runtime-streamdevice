# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: yaskawaBARTRobot 0-1-I22-ONLY
# Source: /dls_sw/prod/R3.14.12.7/support/yaskawaBARTRobot/0-1-I22-ONLY
# Pristine copy of the StreamDevice protocol + EPICS db/templates from that release,
# with one scripted change in BARTRobot.db: its two genSub records
# ($(P):GET_BARCODE SNAM DecToAsc, $(P):GET_GRIPPER_STATE SNAM GripperState) are
# converted to aSub records (record type only; every field kept, all FTx/FTVx are
# explicit so no type default changes). genSub is not in EPICS 7 base; aSub is.
#
# Templates needing a generic IOC built with this module (not the plain
# generic image):
# - `BARTRobot.db` needs a generic IOC built with `yaskawaBARTRobot` (compiled support), not the plain generic image.
#   Its aSub records call DecToAsc and GripperState, compiled C in the module's
#   yaskawaBARTRobotApp/src/genSubRoutines.c; that IOC must register them ported to
#   aSub (aSubRecord *, same a..e/vala fields). An aSub skips its OUTx puts when the
#   routine returns non-zero (genSub always writes them); both routines always
#   return 0, so this changes nothing here. GripperState reads its SHORT inputs
#   (FTA..FTC) through int pointers - as in the DLS module.
#   Its dlsPLC records (DM0XX..DM7XX, GRIPPER_OPEN/CLOSE, ERROR_RESET) are asyn
#   records on the FINS port PORT, which needs the compiled FINS driver.
#   BARTRobot.db is the DLS build's msi expansion of
#   yaskawaBARTRobotApp/Db/BARTRobot.substitutions (dlsPLC, VisionSystem,
#   BarcodeData, yaskawa, ControllerState, yaskawaLongReadOnly, yaskawaLongNoSync,
#   SamplePositions templates); the build left $(STREAMS_PORT,undefined) and
#   $(NEXT_SLOT_VAR_NUM,undefined) in 9 record links, which expand to the
#   STREAMS_PORT / NEXT_SLOT_VAR_NUM parameter values.
#
# Beamline-specific content: the only BL13J reference is the VisualDCT header
# comment `#! DBD("../../../BL13J-BUILDER/iocs/BL13J-MO-IOC-10/dbd/...")` in
# yaskawa.template, yaskawaReal.template and BARTRobot.db; no record uses a
# hard-coded prefix (every PV name is built from $(P)), so nothing needed a macro.
#
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/yaskawaBARTRobot/ release.

module: yaskawaBARTRobot

entity_models:
  - name: yaskawaPosition
    description: |-
      Define yaskawa robot controller Position variables that can be set and read in EPICS
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      VAR:
        type: str
        description: |-
          P Variable to read/write
      SCAN:
        type: str
        description: |-
          Scan rate or readback
    databases:
      - file: yaskawaPosition.template
        args:
          .*:

  - name: yaskawaLong
    description: |-
      Define yaskawa robot controller Long (int32) variables that can be set and read in EPICS.
      Yaskawa refers to these as a "double precision variables"
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      VAR:
        type: str
        description: |-
          Long integer (int32) to read/write. D Variable (e.g. D001) as Yaskawa refers to these as double precision variables.
      DISWRITE:
        type: str
        description: |-
          When the given PV is equal to DISV this variable cannot be written to. Default can't just be set to the prefix otherwise record will not be processed. STA2=64 is used as this prevents this variable being changed when the robot servo is on.
        default: STA2
      DISV:
        type: str
        description: |-
          Value that DISWRITE is compared to
        default: "64"
      SCAN:
        type: str
        description: |-
          Scan rate
      DRVL:
        type: float
        description: |-
          Low limit
      DRVH:
        type: float
        description: |-
          High limit
      DESC:
        type: str
        description: |-
          Variable's description
        default: ""
    databases:
      - file: yaskawaLong.template
        args:
          .*:

  - name: yaskawaLongNoSync
    description: |-
      Define yaskawa robot controller Long (int32) variables that can be set and read in EPICS
      without syncing the target value with the RBV.
      Yaskawa refers to these as a "double precision variables"
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      VAR:
        type: str
        description: |-
          Long integer (int32) to read/write but without sync of target value to RBV. D Variable (e.g. D001) as Yaskawa refers to these as double precision variables.
      DISWRITE:
        type: str
        description: |-
          When the given PV is equal to DISV this variable cannot be written to. Default can't just be set to the prefix otherwise record will not be processed. STA2=64 is used as this prevents this variable being changed when the robot servo is on.
        default: STA2
      DISV:
        type: str
        description: |-
          Value that DISWRITE PV is compared to
        default: "64"
      SCAN:
        type: str
        description: |-
          Scan rate
      DRVL:
        type: float
        description: |-
          Low limit
      DRVH:
        type: float
        description: |-
          High limit
      DESC:
        type: str
        description: |-
          Variable's description
        default: ""
    databases:
      - file: yaskawaLongNoSync.template
        args:
          .*:

  - name: yaskawaLongReadOnly
    description: |-
      Define yaskawa robot controller Long (int32) variables that can not be changed from EPICS.
      Yaskawa refers to these as a "double precision variables"
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      VAR:
        type: str
        description: |-
          Long integer (int32) just for reading from robot controller. D Variable (e.g. D001) as Yaskawa refers to these as double precision variables.
      SCAN:
        type: str
        description: |-
          Scan rate
      DESC:
        type: str
        description: |-
          Variable's description
        default: ""
    databases:
      - file: yaskawaLongReadOnly.template
        args:
          .*:

  - name: yaskawaByte
    description: |-
