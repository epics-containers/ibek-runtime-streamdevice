  - name: yaskawa
    description: |-
      Yaskawa robot controller: status, position, servo and job control
    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      TYPE:
        type: str
        description: |-
          Robot type: NX, FS, DX or YR
      COORDSYS:
        type: str
