    parameters:
      P:
        type: str
        description: |-
          Device Prefix
      STREAMS_PORT:
        type: str
        description: |-
          Asyn Port
      VAR:
        type: str
        description: |-
          B Variable (Byte) to read/write (e.g. B001)
      SCAN:
        type: str
        description: |-
          Scan rate
      DRVL:
        type: float
        description: |-
          Low limit
      DRVH:
        type: float
        description: |-
          High limit
      DESC:
        type: str
        description: |-
          Variable's description
