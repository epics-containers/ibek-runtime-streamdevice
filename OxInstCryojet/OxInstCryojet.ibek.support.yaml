        args:
          .*:

  - name: ILM201
    description: |-
      Imported from DLS module OxInstCryojet (ILM201.template)
    parameters:
      P:
        type: str
        description: |-
          PV name prefix
      PORT:
        type: str
        description: |-
          asyn name for serial port connected to device
      HIHI_LIMIT:
        type: float
        description: |-
          Optional macro for HIHI value for LEVEL record. Defaults to 90
        default: 90.0
      HIGH_LIMIT:
        type: float
        description: |-
          Optional macro for HIGH value for LEVEL record. Defaults to 81
        default: 81.0
      LOW_LIMIT:
        type: float
        description: |-
          Optional macro for LOW value for LEVEL record. Defaults to 39
        default: 39.0
      LOLO_LIMIT:
        type: float
        description: |-
          Optional macro for LOLO value for LEVEL record. Defaults to 20.5
        default: 20.5
      DISABLED:
        type: int
        description: |-
          Optional macro for whether device is polled or not.
        default: 1
      LVLDESC:
        type: str
        description: |-
          Optional macro for the label string for the level.  Used in EDM screens.
        default: "Cryo fill level"
    databases:
      - file: ILM201.template
        args:
          .*:

  - name: ITC4
    description: |-
