# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: OxInstCryojet 2-28
# Source: /dls_sw/prod/R3.14.12.7/support/OxInstCryojet/2-28
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/OxInstCryojet/ release.

module: OxInstCryojet

entity_models:
  - name: cryojetITC503S
    description: |-
      Oxford Instruments Cryojet ITC503S temperature controller
    parameters:
      P:
        type: str
        description: |-
          PV name prefix
      Q:
        type: str
        description: |-
          PV name suffix
      PORT:
        type: str
        description: |-
          asyn name for serial port connected to device
      DISABLED:
        type: int
        description: |-
          Optional - whether device is polled or not. 1 Disabled, 0 Enabled, defaults to 1.
        default: 1
      ST1DESC:
        type: str
        description: |-
          Optional - description/EDM screen label for temperature sensor 1, defaults to empty string.
        default: ""
      ST2DESC:
        type: str
        description: |-
          Optional - description/EDM screen label for temperature sensor 2, defaults to empty string.
        default: ""
      ST3DESC:
        type: str
        description: |-
          Optional - description/EDM screen label for temperature sensor 3, defaults to empty string.
        default: ""
      ST1EGU:
        type: str
        description: |-
          Optional - Engineering units for temperature sensor 1, defaults to K.
        default: K
      ST2EGU:
        type: str
        description: |-
          Optional - Engineering units for temperature sensor 2, defaults to K.
        default: K
      ST3EGU:
        type: str
        description: |-
          Optional - Engineering units for temperature sensor 3, defaults to mbar.
        default: mBar
    databases:
      - file: cryojetITC503S.template
        args:
          .*:

  - name: cryojet
    description: |-
      Oxford Instruments Cryojet temperature controller
    parameters:
      P:
        type: str
        description: |-
          PV name prefix
      Q:
        type: str
        description: |-
          PV name suffix
      PORT:
        type: str
        description: |-
          asyn name for serial port connected to device
      DISABLED:
        type: int
        description: |-
          Optional macro for whether device is polled or not.
        default: 1
      STR:
        type: str
        description: |-
          Gui titlebar label
        default: ""
    databases:
      - file: cryojet.template
        args:
          .*:

