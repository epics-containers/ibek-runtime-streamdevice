# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: enzLoCuM4 2-42
# Source: /dls_sw/prod/R3.14.12.7/support/enzLoCuM4/2-42
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release,
# except for these scripted changes:
# - enzLoCuM4Readback_generic_diagonal.template: include target given its real
#   file name (`..._common` -> `..._common.template`), and a stray trailing `)` removed
#   from 2 CALC expressions (EPICS 7 rejects the unbalanced expression).
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/enzLoCuM4/ release.
#
# Templates needing a generic IOC built with this module (not the plain
# generic image):
# - `enzLoCuM4Readback.template` needs a generic IOC built with `enzLoCuM4` (compiled support), not the plain generic image.

module: enzLoCuM4

entity_models:
  - name: enzLoCuM4
    description: |-
      Template database for an ENZ LoCuM-4 Low Current Monitor
    parameters:
      device:
        type: str
        description: |-
          Device name
      port:
        type: str
        description: |-
          Serial port on IOC (e.g. ty_40_1)
      adr:
        type: str
        description: |-
          Address (e.g. 01)
      noinit:
        type: str
        description: |-
          Set to _noinit to suppress @init processing
        default: ""
    databases:
      - file: enzLoCuM4.template
        args:
          .*:

  - name: enzLoCuM4Readback
    description: |-
      Imported from DLS module enzLoCuM4 (enzLoCuM4Readback.template)
      NOTE: needs a generic IOC built with enzLoCuM4 (not the plain generic image).
    parameters:
      device:
        type: str
        description: |-
          Device name
      adel:
        type: str
        description: |-
          adel
        default: "0.002*B"
      desc_prefix:
        type: str
        description: |-
          desc_prefix
      blade_a_card:
        type: str
        description: |-
          blade_a_card
      blade_a_chan:
        type: str
        description: |-
          blade_a_chan
      blade_b_card:
        type: str
        description: |-
          blade_b_card
      blade_b_chan:
        type: str
        description: |-
          blade_b_chan
      blade_c_card:
        type: str
