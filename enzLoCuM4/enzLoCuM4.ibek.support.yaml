          blade_c_card
      blade_c_chan:
        type: str
        description: |-
          blade_c_chan
      blade_d_card:
        type: str
        description: |-
          blade_d_card
      blade_d_chan:
        type: str
        description: |-
          blade_d_chan
      egu:
        type: str
        description: |-
          Engineering units
    databases:
      - file: enzLoCuM4Readback.template
        args:
          .*:

  - name: enzLoCuM4Readback_generic_diagonal
