# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: leybold 2-2
# Source: /dls_sw/prod/R3.14.12.7/support/leybold/2-2
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# centerOneGui.template is not imported: it holds only the comment lines
# `# % macro, P, Prefix` and `# % gui, $(name).STAT, edm, centerOne.edl, P=$(P)`,
# which strip-dls-annotations.py would remove, leaving an empty file. The
# center_one_gui entity model that loads it at DLS therefore has no databases.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/leybold/ release.
#
# centerN.template and coolpak.template are not imported: the DLS builder.py
# centerN and coolpak classes create their asyn port at startup with the
# module's compiled centerNConfig and coolpakConfig commands, which no runtime
# image has. They belong in a build-time model.
#
# Entity models: builder.py's AutoSubstitution classes, whose parameters are the
# template's macros, all strings, with the template's own defaults. They match
# ibek-support-dls's leybold models (52b8a51) where builder.py agrees with those:
# the *VLI and DEFAULT_VAL parameters are str, and read_write_floatE_floatE's
# DRVH and DRVL default to "", the value centerOne.xml gives them (builder.py
# requires both, but takes "", which builder2ibek reads as unset). They keep
# builder.py's choice where ibek-support-dls differs: read_int_floatE's HIGH,
# LOW, HIHI and LOLO are str, and the *STO and *VLO defaults of read_write_int
# and read_write_int_floatE are "$(ZRSTI=)" and the like, the values builder
# writes, so an output state falls back to its input state.

module: leybold

entity_models:
  - name: center_one_gui
    description: |-
      The EDM screen link of a Leybold CenterOne gauge controller, which the DLS
      centerOne component adds alongside its records. It creates no records: the
      release's centerOneGui.template holds only a `# % gui` annotation, which has
      no consumer in epics-containers. Accepted so that this entity of a converted
      builder IOC validates.
    parameters:
      P:
        type: str
        description: |-
          PV prefix

