# Imported from DLS production support module: ttiCPX 3-0
# Source: /dls_sw/prod/R3.14.12.7/support/ttiCPX/3-0
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/ttiCPX/ release.

module: ttiCPX

entity_models:
  - name: ttiCPX
    description: |-
      TTi CPX Power Supply
    parameters:
      P:
        type: str
        description: |-
          The prefix name
      PORT:
        type: str
        description: |-
          The asyn port
      device:
        type: str
        description: |-
          device name
    databases:
      - file: ttiCPX_general.template
        args:
          .*:

  - name: ttiCPXChannel
    description: |-
      TTi CPX Power Supply channel
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      CHAN:
        type: str
        description: |-
          CHAN
      MAXV:
        type: float
        description: |-
          MAXV
        default: 0.0
      PORT:
        type: str
        description: |-
          Asyn port name
      MAXI:
        type: float
        description: |-
          MAXI
        default: 0.0
    databases:
      - file: ttiCPX_channel.template
        args:
          .*:
