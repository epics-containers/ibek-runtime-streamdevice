# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: caenN1470 1-4
# Source: /dls_sw/prod/R3.14.12.7/support/caenN1470/1-4
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/caenN1470/ release.
#
# The entity models mirror that release's etc/builder.py: builder class names,
# parameters named as the builder XML attributes, Ident arguments as object
# references, and the arguments builder.py derives done in Jinja.

module: caenN1470

entity_models:
  - name: caenN1470
    description: |-
      CAEN N1470 HV power supply: the board, and channels 0 to NCHANS-1
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      Q:
        type: str
        description: |-
          Device suffix
        default: ""
      PORT:
        type: str
        description: |-
          Asyn port name
      ADDR:
        type: int
        description: |-
          Address of unit, normally 0
      DISABLED:
        type: int
        description: |-
          Default disable mode for comms
        default: 1
      NCHANS:
        type: int
        description: |-
          Number of channels (1..4)
      label0:
        type: str
        description: |-
          Label for channel 0 (the DLS EDM screen's; no record uses it)
        default: ""
      label1:
        type: str
        description: |-
          Label for channel 1 (the DLS EDM screen's; no record uses it)
        default: ""
      label2:
        type: str
        description: |-
          Label for channel 2 (the DLS EDM screen's; no record uses it)
        default: ""
      label3:
        type: str
        description: |-
          Label for channel 3 (the DLS EDM screen's; no record uses it)
        default: ""
    databases:
      - file: caenN1470.template
        args:
          P:
          Q:
          PORT:
          ADDR:
          DISABLED:
      - file: caenN1470chan.template
        enabled: "{{ NCHANS > 0 }}"
        args:
          P:
          Q:
          PORT:
          ADDR:
          CHAN: "0"
      - file: caenN1470chan.template
        enabled: "{{ NCHANS > 1 }}"
        args:
          P:
          Q:
          PORT:
          ADDR:
          CHAN: "1"
      - file: caenN1470chan.template
        enabled: "{{ NCHANS > 2 }}"
        args:
          P:
          Q:
          PORT:
          ADDR:
          CHAN: "2"
      - file: caenN1470chan.template
        enabled: "{{ NCHANS > 3 }}"
        args:
          P:
          Q:
          PORT:
          ADDR:
          CHAN: "3"
    pvi:
      yaml_path: caenN1470.pvi.device.yaml
      ui_macros:
        P:
        Q:
