# Streams protocol file for the pmacStreams protocol
# Commands copied from support/pmacUtil/5-10/pmacUtil/protocol/pmac.proto

# Commands required by the databases which are used to change the hexapod mirrors.

ExtraInput = Ignore;
ReadTimeout = 500;
OutTerminator = "";
InTerminator = ACK;
Separator = CR;

getIntVar
{
  out "\$1" CR;
  in  "%d" CR;
}

setIntVar
{
  out "\$1=%d" CR;
  in;
}

sendString
{
  out "%s" CR;
  in;
}
