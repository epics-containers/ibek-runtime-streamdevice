# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: BL05I 2-95 (its latest tag)
# Source: /dls_sw/prod/R3.14.12.7/support/BL05I/2-95
# The builder classes of that beamline module that use StreamDevice; the rest of
# BL05I is the BL05I pattern of ibek-runtime-support.
#   - BL05I_changeHexapodMirror.template, BL05I_changeHexapodMirror_withReference.template,
#     BL05I_waterChiller.template: pristine copies from the release's db/ (they
#     carry no DLS annotation comments for strip-dls-annotations.py to remove);
#   - changeHexapod.proto: pristine copy of BL05IApp/protocol/changeHexapod.proto;
#   - Hostlink.proto: pristine copy of data/Hostlink.proto from HostLink 3-3, the
#     release BL05I 2-95 builds against
#     (/dls_sw/prod/R3.14.12.7/support/HostLink/3-3). The HostLink pattern ships
#     only HostlinkFINS.proto, and a pattern cannot vendor another's files;
#   - BL05I_waterChiller_settings.req: the PVs of the template's autosave tags.
# Entity model names are the builder classes in etc/builder.py, and parameter names
# their builder XML attributes, so builder2ibek converts an XMLbuilder IOC to them.
# To check for updates: diff this pattern's files against those paths, or against
# the newest /dls_sw/prod/*/support/BL05I/ release.
#
# The hexapod models' PORT is the asyn IP port to the Delta Tau GeoBrick, the one
# its pmac controller uses, e.g. from pmac.pmacAsynIPPort (pmacAsynIPConfigure).
# Their IOC image must ship StreamDevice, calc and busy besides pmac.
#
# BL05I_waterchiller's port is an asyn IP or serial port to the Omron PLC
# (HostLink). The template takes WPDESC and UVDESC with two different defaults
# each; the defaults here are its longer ones, the closer to its macro documentation.

module: BL05I-streamdevice

entity_models:
  - name: BL05I_changeHexapodMirror
    description: |-
      Interfaces to a Delta Tau PLC for changing a hexapod set up from one mirror
      to another (a new Y value for the Tool Centre Point, then another PLC
      recalculates everything). Assumes 2 mirrors.
    parameters:
      P:
        type: str
        description: |-
          Device PV Prefix
      R:
        type: str
        description: |-
          Record PV Prefix
      PLC:
        type: int
        description: |-
          PLC number of Delta Tau PLC to interface with
      PORT:
        type: str
        description: |-
          Asyn port to the Delta Tau controller
      YMTR:
        type: str
        description: |-
          Name of the motor record for the Y-translation of the hexapod (not
          declared in this template)
      M1NAME:
        type: str
        description: |-
          Name or label string for first mirror
        default: Mirror1
      M2NAME:
        type: str
        description: |-
          Name or label string for second mirror
        default: Mirror2
      M1HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using first mirror
        default: 45.0
      M2HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using second mirror
        default: 107.0
      M1LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using first mirror
        default: -45.0
      M2LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using second mirror
        default: 17.0
    databases:
      - file: BL05I_changeHexapodMirror.template
        args:
          .*:
    pvi:
      yaml_path: BL05I_changeHexapodMirror.pvi.device.yaml
      ui_macros:
        P:
        R:

  - name: BL05I_changeHexapodMirror_withRef
    description: |-
      Interfaces to a Delta Tau PLC for changing a hexapod set up from one mirror
      to another (a new Y value for the Tool Centre Point, then another PLC
      recalculates everything). Assumes 2 mirrors and adds a third position for
      the reference or ideal position; works with the updated mirror change PLC.
    parameters:
      P:
        type: str
        description: |-
          Device PV Prefix
      R:
        type: str
        description: |-
          Record PV Prefix
      PLC:
        type: int
        description: |-
          PLC number of Delta Tau PLC to interface with
      PORT:
        type: str
        description: |-
          Asyn port to the Delta Tau controller
      YMTR:
        type: str
        description: |-
          Name of the motor record for the Y-translation of the hexapod (not
          declared in this template)
      M1NAME:
        type: str
        description: |-
          Name or label string for first mirror
        default: Mirror1
      M2NAME:
        type: str
        description: |-
          Name or label string for second mirror
        default: Mirror2
      MREFNAME:
        type: str
        description: |-
          Name or label string for the reference position
        default: Reference
      M1HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using first mirror
        default: 45.0
      M2HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using second mirror
        default: 107.0
      MREFHLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using reference position
        default: 76.0
      M1LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using first mirror
        default: -45.0
      M2LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using second mirror
        default: 17.0
      MREFLLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using reference position
        default: -14.0
    databases:
      - file: BL05I_changeHexapodMirror_withReference.template
        args:
          .*:
    pvi:
      yaml_path: BL05I_changeHexapodMirror_withRef.pvi.device.yaml
      ui_macros:
        P:
        R:

