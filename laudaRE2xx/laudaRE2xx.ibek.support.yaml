# Imported from DLS production support module: laudaRE2xx 2-9-9
# Source: /dls_sw/prod/R3.14.12.7/support/laudaRE2xx/2-9-9
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/laudaRE2xx/ release.

module: laudaRE2xx

entity_models:
  - name: lRE2xx
    description: |-
      Lauda ecoline star edition recirculating chiller, also valid for
      ecoline silver, ecoline gold and proline devices.
    parameters:
      P:
        type: str
        description: |-
          Prefix for PV name
      PORT:
        type: str
        description: |-
          Bus/Port Address (eg. ASYN Port).
      ADDR:
        type: int
        description: |-
          Address on the bus (optional)
      SCAN:
        type: int
        description: |-
          SCAN rate for read parameters.
      HIHI:
        type: float
        description: |-
          HIHI value for input temperature
      HIGH:
        type: float
        description: |-
          HIGH value for input temperature
      LOW:
        type: float
        description: |-
          LOW value for input temperature
      LOLO:
        type: float
        description: |-
          LOLO value for input temperature
      TEMPDESC:
        type: str
        description: |-
          DESC field value on the TEMP record (water temperature).
          Defaults to Chiller water temp
        default: "Chiller water temp"
      RRDRVH:
        type: float
        description: |-
          Ramp rate upper clipping point [C/min]
        default: 10.00
      RRDRVL:
        type: float
        description: |-
          Ramp rate lower clipping point [C/min]
        default: 0.01
    databases:
      - file: lRE2xx.template
        args:
          .*:

