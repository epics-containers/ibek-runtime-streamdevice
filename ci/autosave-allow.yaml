  - problem: "YMCS0009_settings.req: missing; YMCS0009.template tags 8 PV(s)"
  - problem: "YMCS0012_settings.req: missing; YMCS0012.template tags 8 PV(s)"
  - problem: "currAmpADC_settings.req: missing; currAmpADC.template tags 4 PV(s)"
  - problem: "currAmpRange_settings.req: missing; currAmpRange.template tags 4 PV(s)"
  - problem: "currAmpRangeADC_settings.req: missing; currAmpRangeADC.template tags 4 PV(s)"
