# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Started from the DLS support module BL21I
# (/dls_sw/prod/R3.14.12.7/support/BL21I/<version>/BL21ISupportApp):
#   - protocol/SCM10.proto, in every release from 3-0;
#   - Db/SCM10.template (3-0 to 3-4-3), renamed
#     Db/BL21I_SCM10_CryoTemp_Monitor.template from 3-5.
# The getIDN protocol and the IDN_RBV stringin keep BL21I's form (3-5 on).
# Everything else was rewritten and extended with the help of Claude
# (Anthropic) from the Scientific Instruments Model SCM10 manual (ASCII
# command set, printed pages 27-32), so no file here is a copy of BL21I's.
#
# Nothing is written to the instrument at start-up and there is no autosave:
# output records read the instrument's current settings when the IOC starts.
#
# Example ioc yaml (the asyn port comes from an asyn IP or serial entity):
#   - type: scientificInstSCM10.scm10
#     P: BL21I-EA-TMON-01
#     PORT: scm10
#     INTERFACE: RS232

module: scientificInstSCM10

entity_models:
  - name: scm10
    description: |-
      Scientific Instruments SCM10 single channel cryogenic temperature
      monitor: temperature and sensor readings, error status, alarm and
      relay state, alarm set-points, sensor curve and noise filter.
    parameters:
      P:
        type: str
        description: |-
          Device prefix
      PORT:
        type: str
        description: |-
          Asyn port for device
      INTERFACE:
        type: enum
        description: |-
          How the SCM10 is connected. RS232: its serial port, directly or
          through a terminal server; a set command is taken to get no answer
          (inferred: the manual mentions OK only for TCP).
          TCP: its Ethernet data socket (port 9760), which answers each set
          command with OK; the set protocols read that OK.
        default: RS232
        values:
          RS232:
          TCP:
    databases:
      - file: scientificInstSCM10.template
        args:
          .*:
    pvi:
      yaml_path: scm10.pvi.device.yaml
      ui_macros:
        P:
