# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: agilent4UHV 0-1
# Source: /dls_sw/prod/R3.14.12.7/support/agilent4UHV/0-1
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/agilent4UHV/ release.
#
# The entity models mirror that release's etc/builder.py: builder class names,
# parameters named as the builder XML attributes, Ident arguments as object
# references, and the arguments builder.py derives done in Jinja.

module: agilent4UHV

entity_models:
  - name: agilent4UHV
    description: |-
      Agilent 4UHV Ion Pump Controller
    parameters:
      name:
        type: id
        description: |-
          Gui tag; the object name, for the CTLR of each agilent4UHVIonp
      device:
        type: str
        description: |-
          Device name
      port:
        type: str
        description: |-
          Asyn port
    databases:
      - file: agilent4UHV.template
        args:
          device:
          port:
    pvi:
      yaml_path: agilent4UHV.pvi.device.yaml
      ui_macros:
        device:

  - name: agilent4UHVIonp
    description: |-
      Agilent 4UHV Ion Pump Controller (per-pump device)
    parameters:
      CTLR:
        type: object
        description: |-
          agilent4 object
      device:
        type: str
        description: |-
          device name
      pump:
        type: int
        description: |-
          Controller pumpnel
    databases:
      - file: agilent4UHVIonp.template
        args:
          device:
          port: "{{ CTLR.port }}"
          pump:
    pvi:
      yaml_path: agilent4UHVIonp.pvi.device.yaml
      ui_macros:
        device:
