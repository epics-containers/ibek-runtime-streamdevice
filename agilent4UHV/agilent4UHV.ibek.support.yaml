# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: agilent4UHV 0-1
# Source: /dls_sw/prod/R3.14.12.7/support/agilent4UHV/0-1
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/agilent4UHV/ release.
#
# `agilent4UHVIonp`'s `databases.args` excludes its `CTLR` parameter by name (see the
# comment there): `_agilent4UHVIonpTemplate` loads the same agilent4UHVIonp.template
# with `.*`, and an instance holding one of each entity needs both to pass identical
# args so ibek writes one ioc.subst block for the file.

module: agilent4UHV

entity_models:
  - name: _agilent4UHVTemplate
    description: |-
      Agilent 4UHV Ion Pump Controller (controller-level template)
    parameters:
      device:
        type: str
        description: |-
          device name
      port:
        type: str
        description: |-
          asyn serial port number
      pump:
        type: int
        description: |-
          Controller pumpnel
    databases:
      - file: agilent4UHV.template
        args:
          .*:
  - name: _agilent4UHVIonpTemplate
    description: |-
      Agilent 4UHV Ion Pump Controller (per-pump template)
    parameters:
      device:
        type: str
        description: |-
          device name
      port:
        type: str
        description: |-
          asyn serial port number
      pump:
        type: int
        description: |-
          Controller pumpnel
    databases:
      - file: agilent4UHVIonp.template
        args:
          .*:
  - name: agilent4UHV
    description: |-
      Agilent 4UHV Ion Pump Controller
    parameters:
      device:
        type: str
        description: |-
          Device name
      port:
        type: str
        description: |-
          Asyn port
  - name: agilent4UHVIonp
    description: |-
      Agilent 4UHV Ion Pump Controller (per-pump device)
    parameters:
      CTLR:
        type: str
        description: |-
          agilent4 object
      port:
        type: str
        description: |-
          asyn serial port number
      device:
        type: str
        description: |-
          device name
      pump:
        type: int
        description: |-
          Controller pumpnel
    databases:
      - file: agilent4UHVIonp.template
        # CTLR is a parameter of this entity (the agilent4UHV controller
        # object reference) but is not an agilent4UHVIonp.template macro.
        # Excluding it by name, rather than matching every parameter with
        # `.*`, keeps this entity's arg set identical to
        # _agilent4UHVIonpTemplate's, which shares the same template file
        # and does use `.*` - both entities then land in the same
        # ioc.subst block.
        args:
          (?!CTLR$).*:
