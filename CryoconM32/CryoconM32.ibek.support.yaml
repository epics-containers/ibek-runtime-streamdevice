# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.8.0-beta.2/ibek.support.schema.json

# Imported from DLS production support module: CryoconM32 1-7
# Source: /dls_sw/prod/R3.14.12.7/support/CryoconM32/1-7
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/CryoconM32/ release.
#
# The entity models mirror that release's etc/builder.py: builder class names,
# parameters named as the builder XML attributes, Ident arguments as object
# references, and the arguments builder.py derives done in Jinja.

module: CryoconM32

entity_models:
  - name: CryoconM32
    description: |-
      CryoconM32 temperature controller device class (includes sensors and control loops configured with other classes).
    parameters:
      name:
        type: id
        description: |-
          Object name, for the tctrlr of each sensor and control loop
      tctrlr:
        type: str
        description: |-
          The PV prefix for the temperature controller
      port:
        type: str
        description: |-
          Asyn Port
      egu:
        type: str
        description: |-
          Engineering units for sink temperature
        default: K
    databases:
      - file: M32_system.template
        args:
          tctrlr:
          port:
          egu:
    pvi:
      yaml_path: CryoconM32.pvi.device.yaml
      ui_macros:
        tctrlr:

  - name: CryoconM32_sensor
    description: |-
      A sensor channel for the CryoconM32
    parameters:
      tctrlr:
        type: object
        description: |-
          CryoconM32 object
      record:
        type: str
        description: |-
          Raw output suffix
      device:
        type: str
        description: |-
          Sensor output prefix
      sensor:
        type: enum
        description: |-
          Sensor output suffix
        values:
          A:
          B:
      egu:
        type: str
        description: |-
          Engineering units for the sensor output
      adel:
        type: float
        description: |-
          Archive deadband increment
      hihi:
        type: float
        description: |-
          hihi alarm for sensor reading
      high:
        type: float
        description: |-
          high alarm for sensor reading
      low:
        type: float
        description: |-
          low alarm for sensor reading
      lolo:
        type: float
        description: |-
          lolo alarm for sensor reading
      scan:
        type: str
        description: |-
          Scan rate, e.g. 2 or .1
        default: "2"
      desc:
        type: str
        description: |-
          Object description, also used for gda_desc if gda (documentary: no record
          uses it)
        default: ""
      gda:
        type: bool
        description: |-
          Set to True to make available to gda (documentary: no record uses it)
        default: true
    databases:
      - file: M32_sensor.template
        args:
          tctrlr: "{{ tctrlr.tctrlr }}"
          port: "{{ tctrlr.port }}"
          record:
          device:
          sensor:
          egu:
          adel:
          hihi:
          high:
          low:
          lolo:
          scan:
    pvi:
      yaml_path: CryoconM32_sensor.pvi.device.yaml
      ui_macros:
        device:
        record:
        tctrlr: "{{ tctrlr.tctrlr }}"
        sensor:

  - name: CryoconM32_control
    description: |-
      A control loop for the CryoconM32
    parameters:
      tctrlr:
        type: object
        description: |-
          CryoconM32 object
      loop:
        type: int
        description: |-
          Loop number (1 or 2)
      rampratelim:
        type: float
        description: |-
          Limit to the ramprate
      scan:
        type: str
        description: |-
          Scan rate
        default: "2"
      desc:
        type: str
        description: |-
          Object description, also used for gda_desc if gda (documentary: no record
          uses it)
        default: ""
      gda:
        type: bool
        description: |-
          Set to True to make available to gda (documentary: no record uses it)
        default: true
    databases:
      - file: M32_control.template
        args:
          tctrlr: "{{ tctrlr.tctrlr }}"
          port: "{{ tctrlr.port }}"
          loop:
          rampratelim:
          scan:
    pvi:
      yaml_path: CryoconM32_control.pvi.device.yaml
      ui_macros:
        tctrlr: "{{ tctrlr.tctrlr }}"
        loop:
