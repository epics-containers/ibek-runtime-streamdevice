# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Imported from DLS production support module: QPC 2-3
# Source: /dls_sw/prod/R3.14.12.7/support/QPC/2-3
# Pristine copy of the StreamDevice protocol + EPICS db/template from that release.
# To check for updates: diff this pattern's files against that path, or against the
# newest /dls_sw/prod/*/support/QPC/ release.

module: QPC

entity_models:
  - name: digitelQpc
    description: |-
      Digitel QPC ion pump controller (single QPC controller)
    parameters:
      QPC:
        type: str
        description: |-
          QPC Controller PV part name
      port:
        type: str
        description: |-
          asyn serial port number
      unit:
        type: str
        description: |-
          unit number for multi-drop serial (2 hex digits - 01 by default)
        default: "01"
    databases:
      - file: digitelQPCController.template
        args:
          .*:
          PMP: ""
          SYSTEM: ""

  - name: digitelQpcIonp
    description: |-
      Template database for digitel QPC - Ion Pump
    parameters:
      device:
        type: str
        description: |-
          device name
      text:
        type: str
        description: |-
          Text to display in the ion pump controller window (max 15 chars).
        default: "$(device)"
      unit:
        type: str
        description: |-
          unit number for multi-drop serial (2 hex digits - 01 by default)
        default: "01"
      SPLY:
        type: int
        description: |-
          pump supply number (rendered as 2 digits, e.g. 1 -> 01)
      port:
        type: str
        description: |-
          asyn serial port number
      HV:
        type: int
        description: |-
          Target voltage
        default: 3000
      SIZE:
        type: int
        description: |-
          pump size (l/s)
        default: 500
      SPT:
        type: int
        description: |-
          set point number for this pump (rendered as 2 digits, e.g. 1 -> 01)
      spon:
        type: str
        description: |-
          setpoint on
      spoff:
        type: str
        description: |-
          setpoint off
    databases:
      - file: digitelQpcIonp.template
        args:
          .*:
          SPLY: "{{ '%02d' | format(SPLY) }}"
          SPT: "{{ '%02d' | format(SPT) }}"
          controller: ""
